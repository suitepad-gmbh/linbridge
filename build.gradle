buildscript {
    ext {
        kotlin_version='2.0.21'
        coroutine_version = '1.6.2'
        hilt_version = '2.52'
        agp_version = '8.0.0'
        agp_version1 = '7.0.0'
        agp_version2 = '8.1.0'
    }
    repositories {
        mavenCentral()
        mavenLocal()
        google()
        maven { url "https://suitepad.mycloudrepo.io/public/repositories/public"}
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "de.suitepad:gradletools:1.2.0-SNAPSHOT"
        classpath "com.google.firebase:firebase-crashlytics-gradle:3.0.3"
        classpath "com.google.gms:google-services:4.4.2"
    }
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        google()
        maven {url "https://linphone.org/maven_repository/" }
        maven { url "https://suitepad.mycloudrepo.io/public/repositories/public"}
    }
}



